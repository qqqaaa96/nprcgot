<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#000;color:#fff;padding:15px}
div{margin:20px 0;border:1px solid #222;padding:10px}
img{max-width:100%}
time{color:#666;font-size:12px}
</style>
</head>
<body>
<h2>用户上传图片记录</h2>
<div id="box"></div>

<script>
const DB = "https://jsonblob.com/api/jsonBlob/1312411205898577920";

async function loadData() {
    let res = await fetch(DB);
    let data = await res.json();
    let html = "";
    data.forEach(item => {
        html += `
        <div>
            <time>${item.time}</time>
            <br>
            <img src="${item.img}">
        </div>
        `;
    });
    document.getElementById("box").innerHTML = html;
}

// 3秒自动刷新，实时看新上传的图片
setInterval(() => {
    loadData();
}, 3000);

// 页面加载时立即执行一次
loadData();
</script>
</body>
</html>
