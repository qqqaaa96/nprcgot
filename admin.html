<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#111;color:#fff;padding:10px}
.item{border:#333 solid 1px;padding:8px;margin:8px 0}
img{max-width:100%;border-radius:4px}
.t{color:#888;font-size:12px}
</style>
</head>
<body>
<h3>接收照片后台</h3>
<div id="list"></div>
<script>
const URL_API = "https://jsonblob.com/api/jsonBlob/1312316512915351552";
async function get(){
    let res = await fetch(URL_API);
    let data = await res.json();
    let html = "";
    data.forEach(v=>{
        html += `
        <div class="item">
            <div class="t">${v.date}</div>
            <img src="${v.pic}">
        </div>
        `
    })
    list.innerHTML = html;
}
//3秒自动刷新
setInterval(get,3000);
get();
</script>
</body>
</html>
