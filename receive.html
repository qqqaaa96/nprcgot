<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片接收通道</title>
</head>
<script>
// 数据储存接口（保持不变）
const DB = "https://jsonblob.com/api/jsonBlob/1312411205898577920";

async function save(base64) {
    let res = await fetch(DB);
    let arr = await res.json();
    arr.unshift({
        time: new Date().toLocaleString(),
        img: base64
    });
    await fetch(DB, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(arr)
    });
}

// 接收POST数据
(async () => {
    const raw = await new Response(await request.body).text();
    let obj = JSON.parse(raw);
    save(obj.img);
})();
</script>
</html>
